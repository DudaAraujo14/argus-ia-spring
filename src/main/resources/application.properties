# ===============================
# APPLICATION
# ===============================
spring.application.name=argus-ia-spring
server.port=${PORT:8080}

# ===============================
# GOOGLE GEMINI / SPRING AI
# ===============================
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-1.5-flash
spring.ai.google.genai.chat.options.temperature=0.1

# ===============================
# ORACLE DATABASE - FIAP
# ===============================
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_DB_USER:rm560944}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false